<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1400px;height:788px;font-family:'Manrope',system-ui,sans-serif;background:#f6f4ef;
     display:flex;flex-direction:column;justify-content:center;padding:0 96px;position:relative;overflow:hidden}
.rule{position:absolute;left:0;top:0;width:100%;height:14px;background:#1a2744}
.tag{font-size:26px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#009499;margin-bottom:26px}
h1{font-size:82px;line-height:1.06;font-weight:800;color:#1a2744;max-width:1010px;letter-spacing:-.02em}
.sub{margin-top:26px;font-size:31px;line-height:1.4;color:#5a5a5a;max-width:940px;font-weight:400}
.routes{margin-top:56px;display:flex;gap:18px}
.r{flex:1;background:#fff;border:2px solid #e6e2da;border-left:10px solid #009499;border-radius:10px;padding:24px 22px}
.r:nth-child(2){border-left-color:#1a2744}
.r:nth-child(3){border-left-color:#c14a3f}
.r:nth-child(4){border-left-color:#9a9484}
.r b{display:block;font-size:29px;font-weight:800;color:#1a2744;line-height:1.2}
.r span{display:block;margin-top:9px;font-size:25px;color:#6f6a5e;line-height:1.3}
.foot{position:absolute;left:96px;bottom:44px;font-size:24px;color:#8a8a8a}
.blob{position:absolute;right:-190px;top:-190px;width:640px;height:640px;border-radius:50%;background:#efece4}
</style></head><body>
<div class="rule"></div><div class="blob"></div>
<div class="tag">New Jersey</div>
<h1>Who pays for ABA therapy?</h1>
<div class="sub">Four systems, four rulebooks. What the state actually requires, and the deadlines that decide an appeal.</div>
<div class="routes">
  <div class="r"><b>Commercial insurance</b><span>Chapter 115</span></div>
  <div class="r"><b>NJ FamilyCare</b><span>EPSDT autism benefit</span></div>
  <div class="r"><b>Early Intervention</b><span>Birth to three</span></div>
  <div class="r"><b>School district</b><span>Age three and up</span></div>
</div>
<div class="foot">Mastermind Behavior</div>
</body></html>
