<!-- Noindex for paginated URLs -->
<script>
(function () {
  if (window.location.search.includes("_page=")) {
    var existing = document.querySelector('meta[name="robots"]');
    if (existing) {
      existing.setAttribute("content", "noindex, follow");
    } else {
      var meta = document.createElement("meta");
      meta.name = "robots";
      meta.content = "noindex, follow";
      document.head.appendChild(meta);
    }
  }
})();
</script>
<!-- Canonical enforcement (overrides Finsweet) -->
<script>
(function () {
  var cleanUrl = window.location.origin + window.location.pathname;

  function fixCanonical() {
    var canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement("link");
      canonical.rel = "canonical";
      document.head.appendChild(canonical);
    }
    if (canonical.href !== cleanUrl) {
      canonical.href = cleanUrl;
    }
  }

  fixCanonical();

  var observer = new MutationObserver(function () {
    fixCanonical();
  });

  observer.observe(document.head, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["href"]
  });

  document.addEventListener("DOMContentLoaded", function () {
    fixCanonical();
    setTimeout(fixCanonical, 500);
    setTimeout(fixCanonical, 1500);
  });
})();
</script>
